[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytab"
version = "0.1.0"
description = "Open-source statistical toolkit inspired by Minitab."
authors = [
    { name = "Debora Rebula" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "reportlab>=4.0.0",
    "streamlit>=1.30.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["."]

